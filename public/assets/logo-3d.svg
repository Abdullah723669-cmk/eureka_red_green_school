<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Eureka Red Green School logo">
  <defs>
    <linearGradient id="face" x1="14" y1="12" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#12B886"/>
      <stop offset="0.45" stop-color="#00875F"/>
      <stop offset="1" stop-color="#00553D"/>
    </linearGradient>
    <linearGradient id="edge" x1="32" y1="44" x2="32" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00402F"/>
      <stop offset="1" stop-color="#002A1F"/>
    </linearGradient>
    <linearGradient id="gloss" x1="16" y1="12" x2="34" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="letter" x1="24" y1="24" x2="42" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D7EFE6"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="14" y1="46" x2="50" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F0454F"/>
      <stop offset="1" stop-color="#B01821"/>
    </linearGradient>
    <linearGradient id="capTop" x1="16" y1="2" x2="48" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD86A"/>
      <stop offset="1" stop-color="#E09A00"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00170F" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#00170F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="32" cy="60" rx="21" ry="3.6" fill="url(#shadow)"/>

  <!-- outline halo so the badge stays legible on the green header -->
  <rect x="9" y="14" width="46" height="44" rx="13" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>

  <!-- extruded side of the badge -->
  <rect x="9" y="19" width="46" height="39" rx="13" fill="url(#edge)"/>
  <!-- badge face -->
  <rect x="9" y="14" width="46" height="39" rx="13" fill="url(#face)"/>
  <rect x="9" y="14" width="46" height="39" rx="13" fill="url(#gloss)"/>
  <rect x="11" y="16" width="42" height="35" rx="11" fill="none" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="1"/>

  <!-- monogram -->
  <g transform="translate(1.3 1.3)" opacity="0.4">
    <path d="M24.5 24h16.2v5.9H30.8v3.9h8.9v5.8h-8.9v4.2h10.2V50H24.5Z" fill="#00301F"/>
  </g>
  <path d="M24.5 24h16.2v5.9H30.8v3.9h8.9v5.8h-8.9v4.2h10.2V50H24.5Z" fill="url(#letter)"/>

  <!-- red ribbon accent -->
  <path d="M13 46.8c8.4 5 29.6 5 38 0v3.6c-8.4 5-29.6 5-38 0Z" fill="url(#ribbon)"/>

  <!-- graduation cap -->
  <path d="M32 16.2 12.5 9.4 32 2.6l19.5 6.8Z" fill="url(#capTop)"/>
  <path d="M32 16.2 12.5 9.4v2l19.5 6.8 19.5-6.8v-2Z" fill="#A96C00"/>
  <path d="M22 12.6v6.1c0 2.6 4.5 4.2 10 4.2s10-1.6 10-4.2v-6.1l-10 3.6Z" fill="#00402F" opacity="0.35"/>
  <path d="M49.6 10.9v8.6" stroke="#C8891C" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="49.6" cy="21" r="2.4" fill="url(#capTop)"/>
</svg>
